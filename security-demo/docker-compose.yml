services:                                #Services for the application.
  redis:                                  #Redis service.
    image: redis:7-alpine #Redis image. ( alphine mean light weight linux distro)
    ports:
      - "6379:6379" #Redis port.
    healthcheck:  # thease commands to check whether docker is actually running or not.
      test: ["CMD", "redis-cli", "ping"] #Redis healthcheck.
      interval: 5s #Redis healthcheck interval.
      timeout: 3s #Redis healthcheck timeout.
      retries: 5 #Redis healthcheck retries.

  minio: #Minio service.
    image: minio/minio:latest #Minio image. ( latest mean the latest version of minio)
    command: server /data --console-address ":9001" #Minio command.
    ports:
      - "9000:9000" #Minio port.  ( two ports for one for the backend other for the webdashboard)
      - "9001:9001" #Minio console port. built-in web dashboard for minio.
    environment:
      MINIO_ROOT_USER: minioadmin #Minio root user.
      MINIO_ROOT_PASSWORD: minioadmin #Minio root password.
    volumes:
      - minio_data:/data #Minio data volume.

  minio-init: #Minio init service.
    image: minio/mc:latest #Minio init image.       
    depends_on: #Minio init depends on minio service. 
      minio:
        condition: service_started #Minio init depends on minio service started.
    entrypoint: >
      /bin/sh -c "                                       
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;  
      mc mb local/security-demo-attachments --ignore-existing;
      exit 0;
      "

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 5

  notifications:
    build: ../notifications
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://notifications:notifications@postgres:5432/notifications
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ../notifications:/app

  api:                 #API service.
    build: .
    ports:
      - "8000:8000" #API port.
    env_file:
      - .env #Environment file.
    environment:
      REDIS_URL: redis://redis:6379/0 #Redis URL.
      ARQ_QUEUE_NAME: security-demo #ARQ queue name.
      ARQ_MAX_JOBS: 5 #ARQ max jobs.
      S3_ENDPOINT_URL: http://minio:9000 #S3 endpoint URL.
      S3_BUCKET_NAME: security-demo-attachments #S3 bucket name.
      AWS_ACCESS_KEY_ID: minioadmin #AWS access key ID.
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      NOTIFICATIONS_URL: http://notifications:8001
    depends_on: # depends on the services to start before the api service starts.
      redis: #redis service to start before the api service starts.
        condition: service_healthy
      minio-init: #minio-init service to start before the api service starts.
        condition: service_completed_successfully
      notifications:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  worker: #worker service.
    build: . #build the worker service.
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      ARQ_QUEUE_NAME: security-demo
      ARQ_MAX_JOBS: 5
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: security-demo-attachments
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      NOTIFICATIONS_URL: http://notifications:8001
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      notifications:
        condition: service_started
    command: arq workers.settings.WorkerSettings
    volumes:
      - .:/app

volumes:
  minio_data:
  postgres_data:
