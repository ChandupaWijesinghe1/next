# Build backend Docker images and push to Amazon ECR.
# Tags each image with the commit SHA and "latest".
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION            (e.g. eu-north-1)
#
# Optional:
#   ECR_REGISTRY          (defaults to <account>.dkr.ecr.<region>.amazonaws.com)
#   ECR_REPOSITORY_PREFIX (defaults to wseek)

name: ECR Push

on:
  push:
    branches: [main]
    paths:
      - "security-demo/**"
      - "notifications/**"
      - ".github/workflows/ecr-push.yml"
      - "infra/ecr/**"
  workflow_dispatch:

concurrency:
  group: ecr-push-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'wseek' }}

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: security-demo
            dockerfile: security-demo/Dockerfile
            repository: wseek-api
          - service: notifications
            context: notifications
            dockerfile: notifications/Dockerfile
            repository: wseek-notifications

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: meta
        run: |
          REGISTRY="${{ secrets.ECR_REGISTRY }}"
          if [ -z "$REGISTRY" ]; then
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          fi
          echo "image_uri=$REGISTRY/${{ matrix.repository }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}:${{ github.sha }}
            ${{ steps.meta.outputs.image_uri }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Summary
        run: |
          {
            echo "### ECR image pushed"
            echo ""
            echo "- **Service:** ${{ matrix.service }}"
            echo "- **Repository:** \`${{ matrix.repository }}\`"
            echo "- **SHA tag:** \`${{ github.sha }}\`"
            echo "- **Latest tag:** \`latest\`"
            echo "- **Scan on push:** enabled (ECR basic scanning)"
          } >> "$GITHUB_STEP_SUMMARY"
