name: E2E Tests

on:
  push:
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      E2E_API_URL: http://127.0.0.1:8000
      JWT_SECRET_KEY: ci-e2e-secret-key-change-me
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_ENV: development
      ARQ_QUEUE_NAME: security-demo
      ARQ_MAX_JOBS: 5
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      NOTIFICATIONS_URL: http://127.0.0.1:8001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project layout
        id: layout
        shell: bash
        run: |
          if [ -f "package.json" ] && [ -d "e2e" ]; then
            echo "app_dir=." >> "$GITHUB_OUTPUT"
            if [ -d "security-demo" ]; then
              echo "api_dir=security-demo" >> "$GITHUB_OUTPUT"
            elif [ -d "../security-demo" ]; then
              echo "api_dir=../security-demo" >> "$GITHUB_OUTPUT"
            else
              echo "api_dir=" >> "$GITHUB_OUTPUT"
            fi
          elif [ -d "next-app" ] && [ -f "next-app/package.json" ]; then
            echo "app_dir=next-app" >> "$GITHUB_OUTPUT"
            if [ -d "security-demo" ]; then
              echo "api_dir=security-demo" >> "$GITHUB_OUTPUT"
            else
              echo "api_dir=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Unable to locate next-app package.json" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ steps.layout.outputs.app_dir }}/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: ${{ steps.layout.outputs.app_dir }}
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ${{ steps.layout.outputs.app_dir }}
        run: npx playwright install --with-deps chromium firefox

      - name: Build Next.js app
        working-directory: ${{ steps.layout.outputs.app_dir }}
        run: npm run build

      - name: Install and start backend API
        if: steps.layout.outputs.api_dir != ''
        working-directory: ${{ steps.layout.outputs.api_dir }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          printf '%s\n' \
            "JWT_SECRET_KEY=${JWT_SECRET_KEY}" \
            "REDIS_URL=${REDIS_URL}" \
            "ARQ_QUEUE_NAME=${ARQ_QUEUE_NAME}" \
            "ARQ_MAX_JOBS=${ARQ_MAX_JOBS}" \
            "APP_ENV=${APP_ENV}" \
            "CORS_ORIGINS=${CORS_ORIGINS}" \
            "NOTIFICATIONS_URL=${NOTIFICATIONS_URL}" \
            > .env
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/security-demo-api.log 2>&1 &
          echo $! > /tmp/security-demo-api.pid

      - name: Fail if backend is missing
        if: steps.layout.outputs.api_dir == ''
        run: |
          echo "::error::security-demo backend not found in this checkout."
          echo "E2E needs the API at http://127.0.0.1:8000."
          echo "Include security-demo in the repository (monorepo root) or add it next to next-app."
          exit 1

      - name: Wait for backend readiness
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8000/docs" >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become ready"
          [ -f /tmp/security-demo-api.log ] && cat /tmp/security-demo-api.log || true
          exit 1

      - name: Start Next.js production server
        working-directory: ${{ steps.layout.outputs.app_dir }}
        shell: bash
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/next-app.log 2>&1 &
          echo $! > /tmp/next-app.pid

      - name: Wait for frontend readiness
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3000" >/dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to become ready"
          [ -f /tmp/next-app.log ] && cat /tmp/next-app.log || true
          exit 1

      - name: Run Playwright E2E tests
        working-directory: ${{ steps.layout.outputs.app_dir }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ steps.layout.outputs.app_dir }}/playwright-report
            ${{ steps.layout.outputs.app_dir }}/test-results
          retention-days: 7
